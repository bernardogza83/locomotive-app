<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Details</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

    <div class="max-w-3xl mx-auto p-8 bg-white shadow-lg rounded-lg mt-6">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">Certificate Details</h1>

        <div class="mb-4">
            <h3 class="text-lg font-semibold">Certificate:</h3>
            <pre class="bg-gray-200 p-4 rounded text-sm">{{ certificate }}</pre>
        </div>

        <div class="mb-4">
            <h3 class="text-lg font-semibold">Private Key:</h3>
            <pre class="bg-gray-200 p-4 rounded text-sm">{{ private_key }}</pre>
        </div>

        <div class="mb-4">
            <h3 class="text-lg font-semibold">Issuer:</h3>
            <pre class="bg-gray-200 p-4 rounded text-sm">{{ issuer }}</pre>
        </div>
        
        <div class="text-center mt-6">
            <a href="{{ url_for('dashboard') }}" class="bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700">Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
