{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-r from-green-200 to-green-500">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-3xl font-extrabold text-center text-green-600 mb-6">Register</h1>

        <form method="POST">
            <!-- Username Input -->
            <div class="mb-5">
                <label for="username" class="block text-lg font-medium text-gray-600">Username</label>
                <input type="text" class="w-full p-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" id="username" name="username" required>
            </div>

            <!-- Password Input -->
            <div class="mb-5">
                <label for="password" class="block text-lg font-medium text-gray-600">Password</label>
                <input type="password" class="w-full p-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" id="password" name="password" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full p-3 text-white bg-green-600 rounded-lg hover:bg-green-700 transition duration-300 ease-in-out">
                Register
            </button>

            <!-- Login Link -->
            <p class="mt-4 text-center text-gray-600">
                Already have an account? <a href="{{ url_for('login') }}" class="text-green-600 hover:text-green-800">Login here</a>.
            </p>
        </form>
    </div>
</div>
{% endblock %}
